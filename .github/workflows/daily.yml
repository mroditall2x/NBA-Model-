name: daily-nba
on:
  push:
    paths: ["slate/*/lines.json"]       # manually pushed lines (e.g. Outlier) build that night's card
  workflow_dispatch:
    inputs:
      date: {description: "slate date YYYY-MM-DD", required: false}
      fetch: {description: "pull lines from The Odds API first", type: boolean, default: true}
      props_all: {description: "props for every game (uses ~16 credits/game; free plan = leave off)", type: boolean, default: false}
      grade_only: {description: "only grade the given date (default yesterday) into graded_log; no lines, no card", type: boolean, default: false}
      job: {description: "timed job sent by the outside scheduler: grade | open | pretip | pretip_lines (game lines only, ~3 credits) | watch", required: false, default: ""}
      test: {description: "test mode: build + grade a past date without touching graded_log", type: boolean, default: false}
permissions: {contents: write, issues: write}
env:
  NBA_DATA: ${{ github.workspace }}/repo/nba
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  PROPS_TEAMS: HOU            # free plan: props only for these teams; add more after upgrading
  TZ: America/Chicago
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy scipy
      - name: hoopR data
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/sportsdataverse/hoopr-nba-data repo
          cd repo && git checkout HEAD -- nba/player_box/parquet/player_box_2025.parquet nba/player_box/parquet/player_box_2026.parquet nba/player_box/parquet/player_box_2027.parquet nba/team_box/parquet/team_box_2025.parquet nba/team_box/parquet/team_box_2026.parquet nba/team_box/parquet/team_box_2027.parquet nba/schedules/parquet/nba_schedule_2027.parquet nba/rosters/parquet/rosters_2027.parquet nba/pbp/parquet/play_by_play_2025.parquet nba/pbp/parquet/play_by_play_2026.parquet nba/pbp/parquet/play_by_play_2027.parquet
      - name: which job
        id: job
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(date +%F)
          echo "date=$D" >> $GITHUB_OUTPUT
          echo "mmdd=${D:5:2}${D:8:2}" >> $GITHUB_OUTPUT
      - name: grade yesterday (8:30)
        if: (github.event.schedule == '34 14 * * *' || github.event.inputs.job == 'grade')
        run: D=$(date -d yesterday +%F); python3 espn_box.py $D || true; python3 grade_day.py $D || true; python3 fb_grade.py $D || true; python3 ats_grade.py $D || true
      - name: grade only (manual / backup)
        if: github.event.inputs.grade_only == 'true'
        run: D="${{ github.event.inputs.date }}"; D=${D:-$(date -d yesterday +%F)}; python3 espn_box.py $D || true; python3 grade_day.py $D; python3 fb_grade.py $D || true; python3 ats_grade.py $D || true
      - name: opening snapshot (11:00)
        if: (github.event.schedule == '7 17 * * *' || github.event.inputs.job == 'open')
        run: python3 fetch_lines.py ${{ steps.job.outputs.date }} --snap
      - name: pre-tip lines (4:45)
        if: (github.event.schedule == '47 22 * * *' || github.event.inputs.job == 'pretip' || github.event.inputs.job == 'pretip_lines')
        run: python3 fetch_lines.py ${{ steps.job.outputs.date }} ${{ github.event.inputs.job == 'pretip_lines' && '--props-teams NONE' || '' }}
      - name: manual fetch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == '' && github.event.inputs.fetch == 'true' && github.event.inputs.test != 'true' && github.event.inputs.grade_only != 'true'
        run: python3 fetch_lines.py ${{ steps.job.outputs.date }} ${{ github.event.inputs.props_all == 'true' && '--props-all' || '' }} $( [ -f slate/${{ steps.job.outputs.mmdd }}/lines.json.open ] || echo --snap )
      - name: build card
        if: (github.event.schedule == '47 22 * * *' || github.event.inputs.job == 'pretip' || github.event.inputs.job == 'pretip_lines') || (github.event.schedule == '7 17 * * *' || github.event.inputs.job == 'open') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.grade_only != 'true' && github.event.inputs.job != 'grade' && github.event.inputs.job != 'watch')
        run: python3 run_day.py ${{ steps.job.outputs.date }}
      - name: line movement check
        if: (github.event.schedule == '47 22 * * *' || github.event.inputs.job == 'pretip' || github.event.inputs.job == 'pretip_lines') || (github.event_name == 'workflow_dispatch' && github.event.inputs.test != 'true' && github.event.inputs.grade_only != 'true' && github.event.inputs.job != 'grade' && github.event.inputs.job != 'watch')
        run: python3 line_moves.py check slate/${{ steps.job.outputs.mmdd }} || true; python3 pick_status.py slate/${{ steps.job.outputs.mmdd }} || true
      - name: injury watch (every 30 min)
        if: github.event.inputs.job == 'watch' || github.event.schedule == '12,42 17-23 * * *' || github.event.schedule == '12,42 0-3 * * *'
        run: |
          python3 injury_watch.py ${{ steps.job.outputs.date }} | tee watch.log || true
          if grep -q REBUILD watch.log; then
            T=$(sed -n 's/^REFRESH //p' watch.log)
            if [ -n "$T" ]; then python3 fetch_lines.py ${{ steps.job.outputs.date }} --props-teams "$T" --merge-props || true; fi
            python3 run_day.py ${{ steps.job.outputs.date }}
            python3 pick_status.py slate/${{ steps.job.outputs.mmdd }} || true
            python3 card_diff.py slate/${{ steps.job.outputs.mmdd }} || true
          fi
      - name: test grade
        if: github.event.inputs.test == 'true'
        run: python3 grade_day.py ${{ steps.job.outputs.date }} --no-log
      - name: email alerts (GitHub issue -> email to the repo owner)
        if: always() && hashFiles('alerts_out.txt') != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh issue create --title "NBA alert $(date '+%b %d %-I:%M %p')" --body-file alerts_out.txt && rm alerts_out.txt
      - name: commit results
        if: always() && github.event.inputs.test != 'true'
        run: |
          git config user.name "nba-bot"; git config user.email "nba-bot@users.noreply.github.com"
          touch early_log.csv; git add graded_log.csv fb_log.csv early_log.csv ats_log.csv ats_teams.csv bet_ledger.csv ledger_issues.csv performance.md model_report.md slate || true
          git commit -m "nba run $(date '+%F %H:%M')" || echo "nothing to commit"
          git pull --rebase -q && git push
